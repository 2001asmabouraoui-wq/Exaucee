  <rect x="136" y="144" width="28" height="42" rx="3" fill="white" opacity="0.45"/>
  <text x="150" y="159" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="7.5" fill="#8B4A58" opacity="0.8">Exaucée</text>
