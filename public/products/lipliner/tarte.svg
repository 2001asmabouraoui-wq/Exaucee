  </defs>
  <rect width="300" height="300" fill="url(#bg-tl)"/>
  <ellipse cx="150" cy="291" rx="26" ry="6" fill="#d4a0b0" opacity="0.22"/>
  <!-- cap -->
  <rect x="130" y="22" width="40" height="72" rx="20" fill="#B76E79"/>
