<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="bg-mg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f8"/>
      <stop offset="100%" stop-color="#fde8f2"/>
    </linearGradient>
    <linearGradient id="tube-mg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f9c8d8"/>
      <stop offset="45%" stop-color="#fde8f2"/>
      <stop offset="100%" stop-color="#f0a8c0"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bg-mg)"/>
  <ellipse cx="150" cy="287" rx="40" ry="7" fill="#d4a0b0" opacity="0.22"/>
  <!-- wand -->
  <rect x="146" y="16" width="8" height="42" rx="4" fill="#d4a0b0"/>
  <ellipse cx="150" cy="16" rx="10" ry="6" fill="#e8b4c4"/>
  <!-- macaron dome top -->
  <ellipse cx="150" cy="55" rx="32" ry="20" fill="#f2c4d4"/>
  <ellipse cx="139" cy="46" rx="11" ry="7" fill="white" opacity="0.28" transform="rotate(-15 139 46)"/>
  <!-- macaron waist -->
  <rect x="116" y="68" width="68" height="14" rx="3" fill="#fde8f2"/>
  <ellipse cx="150" cy="75" rx="34" ry="6" fill="white" opacity="0.15"/>
  <!-- cap body -->
  <rect x="118" y="58" width="64" height="44" rx="8" fill="#e8a5b8"/>
  <rect x="122" y="62" width="18" height="37" rx="5" fill="white" opacity="0.22"/>
  <!-- cap-to-tube seam -->
  <rect x="120" y="98" width="60" height="10" rx="5" fill="#c9899a"/>
  <!-- tube body -->
  <rect x="126" y="106" width="48" height="160" rx="8" fill="url(#tube-mg)"/>
  <rect x="129" y="109" width="13" height="154" rx="4" fill="white" opacity="0.32"/>
  <rect x="126" y="106" width="48" height="160" rx="8" fill="none" stroke="#e8b4c4" stroke-width="1.5"/>
  <!-- base cap -->
  <rect x="120" y="264" width="60" height="22" rx="11" fill="#c9899a"/>
  <ellipse cx="150" cy="264" rx="30" ry="7" fill="#d4a8b8" opacity="0.55"/>
  <!-- bow on cap -->
  <path d="M138 60 C128 48 114 53 122 60 C126 64 136 63 138 60Z" fill="#B76E79"/>
  <path d="M162 60 C172 48 186 53 178 60 C174 64 164 63 162 60Z" fill="#B76E79"/>
  <circle cx="150" cy="61" r="6" fill="#a05a6a"/>
  <circle cx="150" cy="61" r="2.5" fill="#d4889e"/>
</svg>
